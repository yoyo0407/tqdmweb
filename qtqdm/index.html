<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qtqdm progress</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 640px; margin: 10vh auto; padding: 0 20px; color: #202124; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    #state { color: #59636e; margin-bottom: 24px; }
    #state.failed { color: #b42318; font-weight: 700; }
    progress { width: 100%; height: 24px; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
    dt { color: #59636e; }
    dd { margin: 0 0 12px; font-variant-numeric: tabular-nums; }
    h2 { font-size: 1.1rem; margin-top: 24px; }
    canvas { width: 100%; height: auto; border: 1px solid #d8dee4; border-radius: 6px; }
    .hint { color: #59636e; font-size: 0.85rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0 10px; }
    [hidden] { display: none !important; }
    button, input, select { font: inherit; padding: 8px 12px; border: 1px solid #b8c2cc; border-radius: 6px; }
    button { background: #f5f7fa; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    #stop { color: #b42318; }
    #lr-input, #save-step { width: 100px; }
    #control-message { min-height: 1.2em; }
    #save-status { overflow-wrap: anywhere; }
    .chart-settings { padding: 12px; background: #f5f7fa; border-radius: 6px; margin: 12px 0; }
    .axis-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 8px 0; }
    .axis-row label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
    .axis-row input { width: 92px; }
    .axis-row select { width: 138px; }
    .chart-error { color: #b42318; font-size: 0.85rem; margin: 8px 0 0; }
    .chart-caption { overflow-wrap: anywhere; }
    #console-output { max-height: 280px; min-height: 100px; overflow: auto; padding: 12px; border: 1px solid #b8c2cc; border-radius: 6px; font: 13px/1.5 monospace; white-space: pre; }
    #console-status { overflow-wrap: anywhere; }
    summary { cursor: pointer; font-weight: 600; padding: 12px 0; }
  </style>
</head>
<body>
  <h1 id="description">Progress</h1>
  <div id="state">Waiting...</div>
  <progress id="bar"></progress>
  <div class="controls">
    <button id="pause" type="button">Pause</button>
    <button id="stop" type="button">Stop</button>
    <button id="save" type="button" hidden>Save Checkpoint</button>
  </div>
  <p id="control-message" class="hint" role="status"></p>
  <p id="save-status" class="hint" role="status"></p>
  <dl>
    <div><dt>Progress</dt><dd id="started">0</dd></div>
    <div><dt>Completed</dt><dd id="completed">0</dd></div>
    <div><dt>Rate</dt><dd id="rate">—</dd></div>
    <div><dt>Elapsed</dt><dd id="elapsed">0 s</dd></div>
    <div><dt>Remaining</dt><dd id="remaining">—</dd></div>
  </dl>
  <section id="console-section">
    <h2>Console Output</h2>
    <div class="controls">
      <label><input id="console-follow" type="checkbox" checked> Follow Tail</label>
      <button id="console-copy" type="button">Copy Output</button>
      <span id="console-copy-status" class="hint" role="status"></span>
    </div>
    <pre id="console-output" role="log" aria-label="Python stdout and stderr" tabindex="0">Waiting for stdout / stderr...</pre>
    <p id="console-status" class="hint"></p>
  </section>
  <section id="metrics-section" hidden>
    <h2>Metrics</h2>
    <dl id="metrics"></dl>
  </section>
  <section id="loss-section" hidden>
    <h2>Training History</h2>
    <div id="chart-overview"></div>
  </section>
  <form id="lr-form" class="controls" hidden>
    <label for="lr-input">Learning rate</label>
    <input id="lr-input" type="number" step="any" min="0" required>
    <button id="lr-apply" type="submit">Apply</button>
    <span id="lr-current" class="hint"></span>
  </form>
  <form id="save-form" class="controls" hidden>
    <label for="save-step">Checkpoint Step</label>
    <input id="save-step" type="number" min="1" step="1" required>
    <button id="save-schedule" type="submit">Schedule Checkpoint</button>
    <button id="save-cancel" type="button" hidden>Cancel Schedule</button>
  </form>
  <p id="save-schedule-status" class="hint" role="status"></p>
    <h2>Recent History</h2>
    <div id="chart-recent"></div>
    <p class="hint">Leave bounds empty for autoscaling. Switching an axis resets its bounds. Reloading restores defaults.</p>
    <p id="capabilities" class="hint"></p>
  <script src="/charts.js"></script>
  <script src="/console.js"></script>
  <script src="/training_view.js"></script>
  <script>
    const consoleView = createConsoleView();
    const trainingView = createTrainingView({send: async (action, value) => {
      const response = await fetch("/control", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action, value})});
      const result = await response.json();
      if (!response.ok) throw new Error(result.error);
    }});
    async function refresh() {
      try {
        const response = await fetch("/state", {cache: "no-store"});
        if (!response.ok) throw new Error("Server unavailable");
        const data = await response.json();
        consoleView.update(data.console);
        trainingView.update(data, true);
      } catch (error) {
        trainingView.update(null, false);
        document.getElementById("state").textContent = "Disconnected";
      } finally { setTimeout(refresh, 250); }
    }
    refresh();
  </script>
</body>
</html>
